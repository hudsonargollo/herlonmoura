name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build Next.js
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee /tmp/build.log; then
            echo "::error title=Build log tail::$(tail -n 40 /tmp/build.log | tr '\n' '~')"
            grep -iE "error|failed|cannot find|module not found|eai_again|enotfound|timed out|exit code" /tmp/build.log | tail -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "::error title=Missing secret::CLOUDFLARE_API_TOKEN is not set (or empty) in this repo's Actions secrets."; fi
          if [ -z "$CF_ACCOUNT" ]; then echo "::error title=Missing secret::CLOUDFLARE_ACCOUNT_ID is not set (or empty) in this repo's Actions secrets."; fi
          [ -n "$CF_TOKEN" ] && echo "CLOUDFLARE_API_TOKEN present (len ${#CF_TOKEN})"
          [ -n "$CF_ACCOUNT" ] && echo "CLOUDFLARE_ACCOUNT_ID present (len ${#CF_ACCOUNT})"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 pages deploy out --project-name=herlon-moura-website 2>&1 | tee /tmp/deploy.log; then
            echo "::error title=Deploy log tail::$(tail -n 30 /tmp/deploy.log | tr '\n' '~')"
            grep -iE "error|failed|unauthor|authentication|not found|10000|permission" /tmp/deploy.log | tail -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
