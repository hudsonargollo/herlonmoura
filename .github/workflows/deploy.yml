name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build Next.js
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee /tmp/build.log; then
            echo "::error title=Build log tail::$(tail -n 40 /tmp/build.log | tr '\n' '~')"
            grep -iE "error|failed|cannot find|module not found|eai_again|enotfound|timed out|exit code" /tmp/build.log | tail -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=herlon-moura-website
