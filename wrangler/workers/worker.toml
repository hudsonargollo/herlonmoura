name = "herlon-moura-crm"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "herlonmoura_crm"
database_id = "d2852878-3462-47f7-a799-71a07015814b"

[[kv_namespaces]]
binding = "KV"
id = "40662a6fbf1249299a71124fbcd647d7"

[ai]
binding = "AI"

[vars]
JWT_SECRET = "change-me-in-production-use-a-secure-random-value"
ADMIN_EMAIL = "admin@herlonmoura.com"

[triggers]
crons = ["0 6 * * *"]

# Routes require a zone in the Cloudflare account.
# api.herlonmoura.com has no zone yet (domain is at HostGator).
# The worker is reachable at its default URL.
# To add custom domain later: add zone -> set zone_id -> re-deploy.
